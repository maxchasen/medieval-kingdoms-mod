# Done to increase the memory available to gradle.
# Do not set org.gradle.java.home here: it breaks CI (Linux agents) and other machines.
# To pin the daemon JDK locally, add org.gradle.java.home=... to ~/.gradle/gradle.properties
# (see SETUP-JAVA.md — typical Homebrew Apple Silicon: /opt/homebrew/opt/openjdk@21/.../Home).
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.2
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.medievalkingdoms

# Dependencies
# Latest stable Fabric API for 1.21.11 (see Modrinth); bump via https://fabricmc.net/develop/
fabric_api_version=0.141.4+1.21.11